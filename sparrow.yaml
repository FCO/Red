tasks:
  -
    language: Bash
    name: zef_test
    default: true
    code: |
      set -e
      sudo apk add --no-cache sqlite-libs sqlite-dev
      export RED_DATABASE="SQLite"
      cd source/
      raku --version
      zef install . --deps-only --test-depends --build-depends --/test .
      zef test . --verbose
