name: docker-test
on:
  push:
    branches:
      - master
      - "*"
  pull_request:

jobs:
  build-and-test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build base image
        run: docker build -t red-test:base -f Dockerfile .
      - name: Run tests (SQLite)
        run: |
          docker run --rm --env RAKUDO_RAKUAST=0 --entrypoint "" red-test:base sh -c "raku -V && zef install --/test . && prove6 -lj8 t"
