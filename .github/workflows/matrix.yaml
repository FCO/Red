name: test
on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:
jobs:
  raku:
    name: Raku ${{ matrix.raku-version }} (RakuAST=${{ matrix.rakuast }})
    strategy:
      fail-fast: false
      matrix:
        rakuast: ["0", "1"]
        os:
          - ubuntu-latest
        raku-version:
          - "2026.06"
          - "2026.09"
        exclude:
          - raku-version: "2026.06"
            rakuast: "1"
    runs-on: ${{ matrix.os }}
    env:
      RAKUDO_RAKUAST: ${{ matrix.rakuast }}
    steps:
      - uses: actions/checkout@v3
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - run: raku -V
      - name: Install dependencies
        run: |
          zef install --/test --test-depends --deps-only .
          zef install --/test App::Prove6
      - name: Run tests
        run: prove6 -lj8 t

  mysql:
    name: MySQL (RakuAST=${{ matrix.rakuast }})
    strategy:
      fail-fast: false
      matrix:
        rakuast: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAKUDO_RAKUAST: ${{ matrix.rakuast }}
      RED_SOURCE: ${{ github.workspace }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: red-ci-test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: red-ci-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pred-ci-test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - name: Check out the MySQL driver
        uses: actions/checkout@v4
        with:
          repository: FCO/Red-Driver-MySQL
          ref: abe3a0ee01f62dc7f4da371c74a4a3bdddf77ddb
          path: .ci/mysql-driver
      - uses: Raku/setup-raku@v1
        with:
          raku-version: "2026.09"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libsqlite3-dev uuid-dev
          zef install --/test --test-depends --deps-only .
          zef install --/test App::Prove6
      - name: Run tests (MySQL)
        run: prove6 -j8 -e "raku $GITHUB_WORKSPACE/.ci/mysql-driver/tools/red-test-exec.raku" t

  pg:
    name: PostgreSQL (RakuAST=${{ matrix.rakuast }})
    strategy:
      fail-fast: false
      matrix:
        rakuast: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAKUDO_RAKUAST: ${{ matrix.rakuast }}
      RED_SOURCE: ${{ github.workspace }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: red-ci-test
      PGDATABASE: postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: red-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Pg driver
        uses: actions/checkout@v4
        with:
          repository: FCO/Red-Driver-Pg
          ref: 6615b55d109db7ea7ca3469364080e873f1bf9a5
          path: .ci/pg-driver
      - uses: Raku/setup-raku@v1
        with:
          raku-version: "2026.09"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client libsqlite3-dev uuid-dev
          zef install --/test --test-depends --deps-only .
          zef install --/test --test-depends --deps-only .ci/pg-driver
          zef install --/test App::Prove6
      - name: Run tests (Pg)
        run: prove6 -j8 -e "bash $GITHUB_WORKSPACE/.ci/pg-driver/tools/pg-test-exec.sh" t
